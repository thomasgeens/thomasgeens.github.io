# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
  options:
    - commands: [lsp-proxy]
      args: --jobs=4
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - renovate@44.143.0
    - actionlint@1.7.12
    - checkov@3.3.26
    - git-diff-check
    - markdownlint@0.49.1
    - prettier@3.9.9
    - svgo@4.1.0
    - trufflehog@3.99.0
    - yamllint@1.38.0
  ignore:
    - linters: [ALL]
      paths:
        # Temporary files
        - temp/*
    # prettier mangles kramdown IALs ({: .class }) and Liquid highlight blocks
    - linters: [prettier]
      paths:
        - _posts/**
        - _snipdumps/**
        - _projects/**
        # Liquid template, not valid JSON until rendered
        - search.json
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - commitlint
    - trunk-upgrade-available
